name: Tests and container build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Python checks
        run: |
          python -m ruff check .
          python -m pytest -q
      - name: Glasses client checks
        working-directory: mobile/rokid-aiui
        run: npm test
      - name: Build the cloud runtime
        run: docker build --tag babata-ci:local .
      - name: Verify installed runtime
        run: |
          docker run --rm --entrypoint codex babata-ci:local --version
          docker run --rm --entrypoint python babata-ci:local -c "import babata.main; import babata.rokid_gateway; import httptools"
